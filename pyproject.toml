[project]
name = "humper"
version = "0.1.0"
description = "HW3: perceptual metric reproduction & failure analysis (NYCU 535655)"
readme = "README.md"
authors = [
    { name = "Pu-Hsuan Wu", email = "phwu.cs14@nycu.edu.tw" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyiqa>=0.1.16",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
]
